vpcTemplates:
  - name: workload-vpc
    region: *HOME_REGION
    deploymentTargets:
      accounts:
        - App-1
        - App-2
      organizationalUnits: []
      # excludeAccounts: [] 
    ipamAllocations:
      - ipamPoolName: home-region-pool
        netmaskLength: 22
    internetGateway: true
    enableDnsHostnames: true
    enableDnsSupport: true
    instanceTenancy: default
    defaultSecurityGroupRulesDeletion: true
    securityGroups:
      - name: linux-core-sg
        description: ports needed for linux os
        inboundRules:
          - description: Remote access security group rule
            types:
              - SSH
            sources:
              - [SAMPLE IP]
        outboundRules:
          - description: Allow all outbound
            types:
              - ALL
            sources:
              - 0.0.0.0/0
      - name: windows-core-sg
        description: Ports needed for Windows OS
        inboundRules:
          - description: Allow RDP
            types:
              - TCP
            fromPort: 3389
            toPort: 3389
            sources:
              - [SAMPLE IP]
        outboundRules:
          - description: Allow all outbound
            types:
              - ALL
            sources:
              - 0.0.0.0/0
    routeTables:
      - name: workload-PrivateRT
        routes:
          - name: TgwRoute
            destination: 0.0.0.0/0
            type: transitGateway
            target: test-tgw
          - name: S3Gateway
            type: gatewayEndpoint
            target: s3
          - name: DynamoDBGateway
            type: gatewayEndpoint
            target: dynamodb
      - name: workload-Isolated-PrivateRT
        routes:
          - name: S3Gateway
            type: gatewayEndpoint
            target: s3
      - name: workload-PublicRT
        routes:
          - name: IgwRoute
            destination: 0.0.0.0/0
            type: internetGateway
          - name: onprem1
            destination: [SAMPLE ON PREM IP]
            type: transitGateway
            target: test-tgw
          - name: S3Gateway
            type: gatewayEndpoint
            target: s3
          - name: DynamoDBGateway
            type: gatewayEndpoint
            target: dynamodb
    subnets:
      - name: workload-PrivateSubnet-A
        availabilityZone: 1
        routeTable: workload-PrivateRT
        ipamAllocation:
          ipamPoolName: home-region-pool
          netmaskLength: 24
      - name: workload-PrivateSubnet-B
        availabilityZone: 2
        routeTable: workload-PrivateRT
        ipamAllocation:
          ipamPoolName: home-region-pool
          netmaskLength: 24
      - name: workload-isolated-PrivateSubnet-A
        availabilityZone: 1
        routeTable: workload-Isolated-PrivateRT
        ipamAllocation:
          ipamPoolName: home-region-pool
          netmaskLength: 26
      - name: workload-isolated-PrivateSubnet-B
        availabilityZone: 2
        routeTable: workload-Isolated-PrivateRT
        ipamAllocation:
          ipamPoolName: home-region-pool
          netmaskLength: 26
      - name: workload-PublicSubnet-A
        availabilityZone: 1
        routeTable: workload-PublicRT
        ipamAllocation:
          ipamPoolName: home-region-pool
          netmaskLength: 25
      - name: workload-PublicSubnet-B
        availabilityZone: 2
        routeTable: workload-PublicRT
        ipamAllocation:
          ipamPoolName: home-region-pool
          netmaskLength: 25

    transitGatewayAttachments:
      - name: workloadvpc-Tgw-Attachment
        transitGateway:
          name: test-tgw
          account: Network
        routeTableAssociations:
          - workload-TgwRT
        routeTablePropagations:
          - Network-Egress-TgwRT
          - Network-Inspection-TgwRT
          - Network-Ingress-TgwRT
        subnets:
          - workload-PrivateSubnet-A
          - workload-PrivateSubnet-B
    gatewayEndpoints:
      defaultPolicy: Default
      endpoints:
        - service: s3
        - service: dynamodb
    interfaceEndpoints:
      central: false
      defaultPolicy: Default
      subnets:
          - workload-PrivateSubnet-A
          - workload-PrivateSubnet-B
      endpoints:
        - service: ec2
        - service: ec2messages
        - service: ssm
        - service: ssmmessages
        - service: kms
        - service: logs
        - service: lambda
        - service: glue
    useCentralEndpoints: false
    resolverRules: []

#Flow Log configurations
vpcFlowLogs:
  trafficType: ALL
  maxAggregationInterval: 600
  destinations:
    - s3
    - cloud-watch-logs
  destinationsConfig:
    s3:
      lifecycleRules: []
    cloudWatchLogs:
      retentionInDays: 365
  defaultFormat: false
  customFields:
    - version
    - account-id
    - interface-id
    - srcaddr
    - dstaddr
    - srcport
    - dstport
    - protocol
    - packets
    - bytes
    - start
    - end
    - action
    - log-status
    - vpc-id
    - subnet-id
    - instance-id
    - tcp-flags
    - type
    - pkt-srcaddr
    - pkt-dstaddr
    - region
    - az-id
    - pkt-src-aws-service
    - pkt-dst-aws-service
    - flow-direction
    - traffic-path